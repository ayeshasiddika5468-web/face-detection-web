<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Emotion Detection</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">
    <h1>🎤 Speech Emotion Detection</h1>
    <p>Speak a sentence and detect your emotion</p>

    <button id="startBtn">🎙️ Start Speaking</button>

    <div class="box">
        <h3>Recognized Speech</h3>
        <p id="speech">Click the button and speak...</p>
    </div>

    <div class="emotion-box">
        <h3>Detected Emotion</h3>
        <div id="emotion">😐 Neutral</div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
